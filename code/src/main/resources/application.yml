x`server:
  port: 8080

spring:
  application:
    name: kafka-saga-agent

  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/saga_db
    username: saga_user
    password: saga_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  # Apache Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: saga-agent-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.enterprise.agent.saga.domain,com.enterprise.agent.saga.dto,java.util,java.lang"

# Saga Application Specific Settings
saga:
  topics:
    tasks: saga.agent.tasks
    compensate: saga.agent.compensate
    events: saga.agent.events
  lock:
    ttl-seconds: 60
